openapi: 3.0.3
info:
  title: Product Search API
  description: High-performance product catalog and search service.
  version: 1.0.0

tags:
  - name: Product CRUD
    description: Core product lifecycle operations (backed by primary DB)
  - name: Product Search
    description: Elasticsearch-powered search and faceting

paths:

  # ─── CRUD ─────────────────────────────────────────────────────────────────

  /products:
    post:
      tags: [Product CRUD]
      summary: Create a new product
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid request body
        '409':
          description: Product with the same SKU already exists

    get:
      tags: [Product CRUD]
      summary: List products (paginated)
      operationId: listProducts
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          description: "Field to sort by, e.g. 'createdAt,desc'"
          schema:
            type: string
        - name: status
          in: query
          description: Filter by product status
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, DISCONTINUED, COMING_SOON]
        - name: category
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'

  /products/{id}:
    get:
      tags: [Product CRUD]
      summary: Get a product by ID
      operationId: getProductById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found

    put:
      tags: [Product CRUD]
      summary: Replace a product (full update)
      operationId: updateProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid request body
        '404':
          description: Product not found

    delete:
      tags: [Product CRUD]
      summary: Delete a product
      operationId: deleteProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Product deleted
        '404':
          description: Product not found

  # ─── SEARCH (Elasticsearch) ────────────────────────────────────────────────

  /products/search:
    get:
      tags: [Product Search]
      summary: Search products with filtering and faceting (Elasticsearch)
      operationId: searchProducts
      parameters:
        - name: search
          in: query
          style: deepObject
          explode: true
          schema:
            $ref: '#/components/schemas/SearchProductsRequest'
      responses:
        '200':
          description: Search results with facets and pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'

components:
  schemas:

    # ─── CRUD Request Bodies ─────────────────────────────────────────────────

    CreateProductRequest:
      type: object
      description: >
        Payload for creating a new product. productId and createdAt are
        server-generated and must not be provided.
      required:
        - sku
        - title
        - price
        - currency
        - inventory
        - status
      properties:
        sku:
          type: string
          example: "SKU-001"
        title:
          type: string
          example: "Ultra Wireless Headphones"
        brand:
          type: string
        description:
          type: string
        category:
          type: string
        categoryPath:
          type: string
          example: "Electronics/Audio/Headphones"
        price:
          type: number
          format: double
        compareAtPrice:
          type: number
          format: double
        currency:
          type: string
          example: "USD"
        inventory:
          type: integer
        status:
          type: string
          enum: [ACTIVE, INACTIVE, DISCONTINUED, COMING_SOON]
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/Attribute'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/Variant'
        flags:
          $ref: '#/components/schemas/ProductFlags'

    UpdateProductRequest:
      type: object
      description: >
        Payload for a full product replacement (PUT). All required fields
        must be supplied; omitted optional fields will be cleared.
      required:
        - sku
        - title
        - price
        - currency
        - inventory
        - status
      properties:
        sku:
          type: string
        title:
          type: string
        brand:
          type: string
        description:
          type: string
        category:
          type: string
        categoryPath:
          type: string
        price:
          type: number
          format: double
        compareAtPrice:
          type: number
          format: double
        currency:
          type: string
        inventory:
          type: integer
        status:
          type: string
          enum: [ACTIVE, INACTIVE, DISCONTINUED, COMING_SOON]
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/Attribute'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/Variant'
        flags:
          $ref: '#/components/schemas/ProductFlags'

    # ─── CRUD Response ───────────────────────────────────────────────────────

    ProductListResponse:
      type: object
      description: Paginated list of products (CRUD list endpoint)
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # ─── Core Domain Model ───────────────────────────────────────────────────

    Product:
      type: object
      properties:
        productId:
          type: string
          example: "PROD-123"
        sku:
          type: string
        title:
          type: string
          example: "Ultra Wireless Headphones"
        brand:
          type: string
        description:
          type: string
        category:
          type: string
        categoryPath:
          type: string
          example: "Electronics/Audio/Headphones"
        price:
          type: number
          format: double
        compareAtPrice:
          type: number
          format: double
        currency:
          type: string
          example: "USD"
        inventory:
          type: integer
        lowStock:
          type: boolean
        status:
          type: string
          enum: [ACTIVE, INACTIVE, DISCONTINUED, COMING_SOON]
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/Attribute'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/Variant'
        ratings:
          $ref: '#/components/schemas/Ratings'
        flags:
          $ref: '#/components/schemas/ProductFlags'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Image:
      type: object
      properties:
        url:
          type: string
        isPrimary:
          type: boolean
        altText:
          type: string

    Attribute:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
        filterable:
          type: boolean

    Variant:
      type: object
      properties:
        variantId:
          type: string
        sku:
          type: string
        price:
          type: number
        compareAtPrice:
          type: number
        inventory:
          type: integer
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/Attribute'

    Ratings:
      type: object
      properties:
        average:
          type: number
          format: float
        count:
          type: integer
        distribution:
          type: object
          additionalProperties:
            type: integer
          description: "Map of star ratings, e.g. {'5': 100, '4': 42}"

    ProductFlags:
      type: object
      properties:
        isFeatured:
          type: boolean
        isBestseller:
          type: boolean
        isNew:
          type: boolean

    # ─── Search (Elasticsearch) ──────────────────────────────────────────────

    SearchProductsRequest:
      type: object
      properties:
        query:
          type: string
          default: "*"
        status:
          type: string
        category:
          type: string
        categoryPath:
          type: string
        title:
          type: string
        brand:
          type: string
        tags:
          type: array
          items:
            type: string
        inStockOnly:
          type: boolean
        isFeatured:
          type: boolean
        isNew:
          type: boolean
        attributes:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        avgRating:
          type: number
          format: double
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        distance:
          type: string
        regions:
          type: array
          items:
            type: string
        storeIds:
          type: array
          items:
            type: string
        page:
          type: integer
          default: 0
        size:
          type: integer
          default: 20
        sort:
          type: string

    SearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        facets:
          type: array
          items:
            $ref: '#/components/schemas/Facet'
        pagination:
          $ref: '#/components/schemas/Pagination'
        timeTaken:
          type: integer
          format: int64

    Pagination:
      type: object
      properties:
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    Facet:
      type: object
      properties:
        name:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/FacetItem'

    FacetItem:
      type: object
      properties:
        key:
          type: string
        count:
          type: integer
          format: int64
