openapi: 3.0.3

info:
  title: Product Catalog API
  description: |
    CRUD service for the product catalog — the Postgres-backed write model.

    API versioning:
    - The externally supported API major version is represented in the URL path.
    - The current API base path is /v1.
    - Additive, backward-compatible changes do not require a new major version.
    - Breaking changes require a new major path, for example /v2.
    - Deprecation of a version is announced with the RFC 9745 Deprecation
      header, the RFC 8594 Sunset header and a Link header with
      rel="successor-version".

    Idempotency:
    - POST operations require an Idempotency-Key header.
    - The key identifies one logical creation attempt.
    - The key, request fingerprint, response and created resource are persisted
      transactionally with the product and transactional outbox records.
    - Retrying the same request with the same key returns the original response
      with Idempotency-Replayed: true.
    - Reusing a key with a different request returns HTTP 422.

    Modelling rules:
    - Product vs Variant. The product is what customers shop for (title,
      media, brand, categories, options). The variant is the sellable unit —
      the cell of the option matrix that lands in the cart and gets fulfilled.
      Variants own SKU, price and lifecycle status. Stock levels are owned by
      the Inventory Service and shipping rate data by the Shipping Service;
      both reference this variant by variantId/sku. No stock or fulfillment
      fields are stored in this model.

    - The option matrix. options on the product declare the axes that
      differentiate variants, for example Color and Size. Each variant carries
      selectedOptions — one cell of that matrix. The matrix is sparse: only
      stocked combinations exist as variants. Variant combinations must be
      unique within the product.

    - Identity. All IDs are UUIDv7, generated by the service before
      persistence. Downstream identity uses variantId/sku rather than
      productId alone. SKU is globally unique across the catalog.

    - Money is amountMinor, an integer minor-unit amount, plus an ISO 4217
      currency code. Floating-point amounts are not accepted.

    - Categories are many-to-many. Requests carry category assignments
      consisting of categoryId and isPrimary. Exactly one assignment per
      product must be primary. Responses embed denormalized CategoryRefs.
      Category paths are derived in the read model only. Category master
      data is owned by this service; the /categories management resource is
      specified separately.

    - Derived fields are out of scope here. ratings, lowStock, categoryPath,
      isNew, isBestseller and bundle inventory are computed by the
      read/projection pipeline and are absent from this API.

  version: 1.0.0

servers:
  - url: https://api.example.com/catalog/v1
    description: Production
  - url: http://localhost:8080/catalog/v1
    description: Local development

tags:
  - name: Product CRUD
    description: Core product lifecycle operations backed by PostgreSQL

paths:

  /products:

    post:
      tags:
        - Product CRUD
      summary: Create a new product
      operationId: createProduct

      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'

      responses:
        '201':
          description: Product created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

        '400':
          $ref: '#/components/responses/BadRequest'

        '409':
          $ref: '#/components/responses/Conflict'

        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    get:
      tags:
        - Product CRUD
      summary: List products
      operationId: listProducts

      parameters:
        - name: page
          in: query
          description: Zero-based page number.
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0

        - name: size
          in: query
          description: Page size. The service enforces the maximum.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20

        - name: sort
          in: query
          description: Sort field and direction. Only whitelisted values are accepted.
          required: false
          schema:
            type: string
            enum:
              - createdAt,asc
              - createdAt,desc
              - updatedAt,asc
              - updatedAt,desc
              - title,asc
              - title,desc
            default: createdAt,desc

        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ProductStatus'

        - name: categoryId
          in: query
          description: Matches products assigned to this category (primary or secondary).
          required: false
          schema:
            type: string
            format: uuid

      responses:
        '200':
          description: Paginated list of products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'

        '400':
          $ref: '#/components/responses/BadRequest'

  /products/{id}:

    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags:
        - Product CRUD
      summary: Get a product by ID
      operationId: getProductById

      responses:
        '200':
          description: Product found.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Product CRUD
      summary: Replace a product
      description: |
        Performs a full replacement of the product representation.

        This operation is semantically idempotent: repeating the same
        successful request produces the same resulting product state.

        Variants are reconciled by variantId: matching variants are updated,
        variants without variantId are created, omitted variants are deleted.
        All matrix, category and bundle rules are re-validated on the merged
        result.

        If If-Match is supplied, the update is applied only when the supplied
        ETag matches the current product version; otherwise 412 is returned.
        If If-Match is omitted, the update is applied without optimistic-lock
        validation.
      operationId: updateProduct

      parameters:
        - name: If-Match
          in: header
          required: false
          description: |
            Optimistic concurrency control value obtained from a previous
            ETag response, for example "7".
          schema:
            type: string
            minLength: 1
            maxLength: 128

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'

      responses:
        '200':
          description: Product updated.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

        '400':
          $ref: '#/components/responses/BadRequest'

        '404':
          $ref: '#/components/responses/NotFound'

        '409':
          $ref: '#/components/responses/UniqueConflict'

        '412':
          $ref: '#/components/responses/PreconditionFailed'

        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      tags:
        - Product CRUD
      summary: Delete a product
      description: |
        Deletes the product and its variants as one composition.

        For products referenced by orders, inventory events, downstream
        projections or other business records, the preferred operation is to
        update the product and set status to DISCONTINUED instead of
        physically deleting it.

        DELETE is semantically idempotent: repeating a successful delete
        does not recreate or modify the product.
      operationId: deleteProduct

      responses:
        '204':
          description: Product deleted.

        '404':
          $ref: '#/components/responses/NotFound'

components:

  parameters:

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUID identifying one logical product-creation attempt.

        The service stores this key together with a request fingerprint
        (method, path and SHA-256 of the request body).

        Retrying the same POST with the same key and an identical request
        body returns the original response with Idempotency-Replayed: true.

        Reusing the same key with a different method, path, query string or
        request body returns 422.

        The key must be unique per creation attempt and must not be reused
        to create another product.
      schema:
        type: string
        format: uuid
        example: 0198f2a4-7c1d-7e6a-b1a2-c3d4e5f60718

  headers:

    Location:
      description: URL of the created resource.
      schema:
        type: string
        format: uri
        example: https://api.example.com/catalog/v1/products/0198f2a4-7c1d-7e6a-9b2e-5f4d3c2b1a09

    ETag:
      description: |
        Current optimistic-lock version of the resource. The value is a
        quoted entity tag, for example "7".
      schema:
        type: string
        example: '"7"'

    IdempotencyReplayed:
      description: |
        Indicates that the response was replayed from a previously completed
        request that used the same Idempotency-Key.

        The header is omitted when the response belongs to the original
        request.
      schema:
        type: boolean
        example: true

    Deprecation:
      description: |
        Reserved for future use. RFC 9745 deprecation indicator, emitted only
        when this endpoint or API version has been formally deprecated.
        The value is an HTTP structured-field date, for example @1767225600.
      schema:
        type: string
        example: '@1767225600'

    Sunset:
      description: |
        Reserved for future use. RFC 8594 date indicating when a deprecated
        endpoint or API version is expected to become unavailable.
      schema:
        type: string
        format: date-time
        example: '2027-01-01T00:00:00Z'

    SuccessorVersion:
      description: |
        Reserved for future use. Link to the successor API version, emitted
        as a Link header with rel="successor-version" when this version is
        deprecated.
      schema:
        type: string
        format: uri
        example: https://api.example.com/catalog/v2

  responses:

    BadRequest:
      description: Invalid request body or query parameters.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    NotFound:
      description: Product not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    UniqueConflict:
      description: |
        A uniqueness constraint was violated. Examples include a duplicate
        variant SKU or an SEO slug already used elsewhere in the catalog.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Conflict:
      description: |
        Request could not be completed because of a conflict. Either:

        - A uniqueness constraint was violated (duplicate variant SKU or SEO
          slug already exists in the catalog), or
        - The Idempotency-Key is currently in use by an in-flight request.
          Retry the same request with the same key after the indicated
          delay; do not generate a new key.
      headers:
        Retry-After:
          description: >
            Seconds to wait before retrying. Present only for the
            idempotency-in-flight case.
          schema:
            type: integer
            minimum: 1
            example: 2
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    PreconditionFailed:
      description: |
        The supplied If-Match value does not match the current product
        version.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    UnprocessableEntity:
      description: |
        The request is syntactically valid but violates a semantic or
        idempotency rule.

        Examples:
        - selectedOptions do not match the declared product options
        - duplicate variant combination within the product
        - missing or duplicate default variant
        - missing or duplicate primary category
        - invalid bundle components
        - Idempotency-Key reused with a different request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:

    ProductStatus:
      type: string
      enum: [ACTIVE, INACTIVE, DISCONTINUED, COMING_SOON]

    VariantStatus:
      type: string
      description: >
        Variant lifecycle. RETIRED variants keep their SKU reserved but can
        no longer be added to carts — use RETIRED rather than omitting a
        variant once its SKU is referenced by orders, inventory events or
        the search projection.
      enum: [ACTIVE, INACTIVE, RETIRED]
      default: ACTIVE

    ProductKind:
      type: string
      description: >
        STANDARD products sell their own variants. BUNDLE products are kits
        assembled from other sellable variants; they carry exactly one
        variant (the bundle SKU) and their inventory/availability are
        computed from components in the read model.
      enum: [STANDARD, BUNDLE]

    Money:
      type: object
      description: >
        Monetary amount in integer minor units plus an ISO 4217 currency
        code. Example: amountMinor=9999, currency=USD → $99.99.
      required: [amountMinor, currency]
      additionalProperties: false
      properties:
        amountMinor:
          type: integer
          format: int64
          minimum: 0
          example: 9999
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: USD

    CategoryRef:
      type: object
      description: >
        Denormalized category snapshot resolved from the assigned categoryId.
        Category master data (the tree) is owned by this service.
      additionalProperties: false
      required: [categoryId, isPrimary]
      properties:
        categoryId:
          type: string
          format: uuid
          example: 0198f2a4-7c1d-7e6a-b1a2-c3d4e5f60718
        name:
          type: string
          maxLength: 128
          example: T-Shirts
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          example: t-shirts
        isPrimary:
          type: boolean
          description: >
            Exactly one assignment per product is primary; it drives listing
            pages and default navigation.

    CategoryAssignment:
      type: object
      description: >
        Request-side category assignment. Exactly one assignment per product
        must have isPrimary=true — zero or multiple primaries → 422.
      required: [categoryId]
      additionalProperties: false
      properties:
        categoryId:
          type: string
          format: uuid
        isPrimary:
          type: boolean
          default: false

    OptionDefinition:
      type: object
      description: >
        A variant axis declared on the product, e.g. "Color" with values
        [Black, Sand]. Option names must be unique within a product and must
        not duplicate an attribute name. Max 3 options keeps the variant
        matrix tractable.
      required: [name, values]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          example: Color
        values:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 100
          example: [Black, Sand]
        position:
          type: integer
          minimum: 0
          description: Display order of this option in pickers.

    SelectedOption:
      type: object
      description: A variant's resolved position in one axis of the option matrix.
      required: [optionName, value]
      additionalProperties: false
      properties:
        optionName:
          type: string
          example: Color
        value:
          type: string
          example: Black

    BundleComponent:
      type: object
      description: >
        One line of a bundle's recipe. `sku` must reference an existing,
        sellable variant SKU of another product — self-reference and unknown
        SKUs are rejected with 422.
      required: [sku, quantity]
      additionalProperties: false
      properties:
        sku:
          type: string
          maxLength: 64
          example: TEE-BLK-M
        quantity:
          type: integer
          minimum: 1
          example: 1

    Attribute:
      type: object
      description: >
        Descriptive product-level fact that is NOT a variant axis, e.g.
        "Material: organic cotton". Variant-distinguishing facts belong in
        options/selectedOptions instead.
      required: [name, value]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 64
        value:
          type: string
          maxLength: 512

    Image:
      type: object
      description: Product image. Exactly one image per product must have isPrimary=true.
      required: [url]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
        altText:
          type: string
          maxLength: 255
        isPrimary:
          type: boolean
          default: false
        position:
          type: integer
          minimum: 0

    Seo:
      type: object
      description: >
        Storefront presentation data. `slug` is unique across the catalog
        and is generated from the title when omitted (409 on conflict).
      additionalProperties: false
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          maxLength: 140
          example: trail-tee
        metaTitle:
          type: string
          maxLength: 160
        metaDescription:
          type: string
          maxLength: 320

    Variant:
      type: object
      description: >
        The sellable unit — one stocked cell of the product's option matrix.
        Owns SKU, price and lifecycle status. The product's `options` explain
        WHY variants differ; `selectedOptions` says which cell this is. SKU
        is globally unique; cart, orders and inventory events reference
        variantId/sku, never productId alone. Stock levels, weights and
        shipping dimensions are NOT stored here — the Inventory and Shipping
        services own them and key off this variant's identity.
      required: [sku, price]
      additionalProperties: false
      properties:
        variantId:
          type: string
          format: uuid
          description: >
            Server-generated UUIDv7. Ignored on create; used by PUT to
            reconcile variants.
        sku:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{2,63}$'
          maxLength: 64
          example: TEE-BLK-M
        selectedOptions:
          type: array
          maxItems: 3
          description: >
            Required when the product declares options: exactly one entry per
            declared option, values must come from the declared value list,
            and the combination must be unique within the product
            (violations → 422). Omit for products with no options.
          items:
            $ref: '#/components/schemas/SelectedOption'
        price:
          $ref: '#/components/schemas/Money'
        compareAtPrice:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/VariantStatus'
        isDefault:
          type: boolean
          default: false
          description: >
            Exactly one variant per product must be the default — its price
            is shown on listing pages and used for deep links. Server assigns
            the first variant if the client does not specify one (422 if the
            payload marks zero or multiple).
        barcode:
          type: string
          pattern: '^[0-9]{8,14}$'
          description: GTIN/UPC/EAN for retail and scanning.
        imageUrls:
          type: array
          maxItems: 5
          description: >
            Variant-specific shots (e.g. the sand colour). Clients fall back
            to the product's images when absent.
          items:
            type: string
            format: uri
            maxLength: 2048

    ProductFlags:
      type: object
      description: >
        Curated merchandising flags. Derived flags (isNew, isBestseller,
        lowStock) are computed in the read model and are not writable here.
      additionalProperties: false
      properties:
        isFeatured:
          type: boolean
          default: false

    Product:
      type: object
      description: >
        Full product resource as stored in the primary database. Business
        rules enforced server-side: option names unique per product; each
        variant's selectedOptions resolves against the declared options with
        a unique combination; exactly one default variant; exactly one
        primary category; BUNDLE products carry exactly one variant plus a
        non-empty bundleComponents recipe.
      additionalProperties: false
      required:
        - productId
        - version
        - title
        - status
        - productKind
        - categories
        - createdAt
        - updatedAt
      properties:
        productId:
          type: string
          format: uuid
          example: 0198f2a4-7c1d-7e6a-9b2e-5f4d3c2b1a09
        version:
          type: integer
          format: int64
          description: Optimistic-lock version. Changes on every update; exposed as ETag.
        title:
          type: string
          maxLength: 255
        brand:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 5000
        categories:
          type: array
          maxItems: 10
          description: Category assignments; exactly one with isPrimary=true.
          items:
            $ref: '#/components/schemas/CategoryRef'
        status:
          $ref: '#/components/schemas/ProductStatus'
        productKind:
          $ref: '#/components/schemas/ProductKind'
        options:
          type: array
          maxItems: 3
          description: The variant axes. Absent for simple products.
          items:
            $ref: '#/components/schemas/OptionDefinition'
        images:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Image'
        attributes:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Attribute'
        variants:
          type: array
          maxItems: 100
          description: >
            May be empty only for content-only drafts; a product cannot be
            purchased or activated without at least one variant.
          items:
            $ref: '#/components/schemas/Variant'
        bundleComponents:
          type: array
          maxItems: 50
          description: Present iff productKind=BUNDLE.
          items:
            $ref: '#/components/schemas/BundleComponent'
        seo:
          $ref: '#/components/schemas/Seo'
        flags:
          $ref: '#/components/schemas/ProductFlags'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateProductRequest:
      type: object
      description: >
        Create a product. productId, version and timestamps are
        server-generated. Variants may be supplied now or added later (draft);
        each variant must carry sku and price.
      required:
        - title
        - categories
        - status
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        brand:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 5000
        categories:
          type: array
          minItems: 1
          maxItems: 10
          description: Exactly one assignment must have isPrimary=true.
          items:
            $ref: '#/components/schemas/CategoryAssignment'
        status:
          $ref: '#/components/schemas/ProductStatus'
        productKind:
          $ref: '#/components/schemas/ProductKind'
        options:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/OptionDefinition'
        images:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Image'
        attributes:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Attribute'
        variants:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Variant'
        bundleComponents:
          type: array
          maxItems: 50
          description: Required iff productKind=BUNDLE.
          items:
            $ref: '#/components/schemas/BundleComponent'
        seo:
          $ref: '#/components/schemas/Seo'
        flags:
          $ref: '#/components/schemas/ProductFlags'

    UpdateProductRequest:
      type: object
      description: >
        Full replacement (PUT). Omitted optional collections are cleared.
        Variants are reconciled by variantId: matching variants updated,
        variants without variantId created, omitted variants deleted. All
        matrix, category and bundle rules are re-validated on the merged
        result.
      required:
        - title
        - categories
        - status
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        brand:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 5000
        categories:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/CategoryAssignment'
        status:
          $ref: '#/components/schemas/ProductStatus'
        productKind:
          $ref: '#/components/schemas/ProductKind'
        options:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/OptionDefinition'
        images:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Image'
        attributes:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Attribute'
        variants:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Variant'
        bundleComponents:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/BundleComponent'
        seo:
          $ref: '#/components/schemas/Seo'
        flags:
          $ref: '#/components/schemas/ProductFlags'

    ProductListResponse:
      type: object
      additionalProperties: false
      required: [results, pagination]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        pagination:
          $ref: '#/components/schemas/Pagination'

    Pagination:
      type: object
      additionalProperties: false
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    Problem:
      type: object
      description: RFC 9457 problem details, returned as application/problem+json.
      additionalProperties: false
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: URI identifying the problem type.
          example: https://api.example.com/problems/idempotency-key-reuse
        title:
          type: string
          example: Idempotency key cannot be reused
        status:
          type: integer
          format: int32
          example: 422
        detail:
          type: string
