openapi: 3.0.3
info:
  title: Product Catalog API
  description: |
    CRUD service for the product catalog — the Postgres-backed **write model**.

    Modelling rules:
    - **Product vs Variant.** The product is what customers shop for (title,
      media, brand, categories, options). The variant is the sellable unit —
      the cell of the option matrix that lands in the cart and gets fulfilled.
      Variants own SKU, price and lifecycle status. Stock levels are owned by
      the Inventory Service and shipping rate data by the Shipping Service;
      both reference this variant by `variantId`/`sku`. No stock or
      fulfillment fields are stored in this model.
    - **The option matrix.** `options` on the product declare the axes that
      differentiate variants (e.g. Color, Size) and the allowed values. Each
      variant carries `selectedOptions` — one cell of that matrix. The matrix
      is sparse: only stocked combinations exist as variants. Variant
      combinations must be unique within the product.
    - **Identity.** All IDs are UUIDv7, generated by the service before
      persistence (time-ordered). Downstream identity: cart, orders,
      inventory events and the Elasticsearch projection reference
      `variantId`/`sku`, never `productId` alone. SKU is globally unique
      across the catalog.
    - **Money** is `amountMinor` (integer minor units) + ISO 4217 currency.
      `9999 USD` = $99.99. Floating-point amounts are not accepted.
    - **Categories are many-to-many.** Requests carry category assignments
      (`categoryId` + `isPrimary`); exactly one assignment per product must
      be primary. Responses embed denormalized `CategoryRef`s. Category
      paths are derived in the read model only. Category master data is
      owned by this service; the /categories management resource is
      specified separately.
    - **Derived fields are out of scope here.** `ratings`, `lowStock`,
      `categoryPath`, `isNew`, `isBestseller` and bundle inventory are
      computed by the read/projection pipeline and are absent from this API.
  version: 2.2.0

tags:
  - name: Product CRUD
    description: Core product lifecycle operations (primary DB)

paths:
  /products:
    post:
      tags: [Product CRUD]
      summary: Create a new product
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Product created.
          headers:
            Location:
              description: URL of the created product.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/UniqueConflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    get:
      tags: [Product CRUD]
      summary: List products (paginated)
      operationId: listProducts
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Page size, hard-capped.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          description: Sort field and direction (whitelisted).
          schema:
            type: string
            enum: ['createdAt,asc', 'createdAt,desc', 'updatedAt,asc', 'updatedAt,desc', 'title,asc', 'title,desc']
            default: 'createdAt,desc'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ProductStatus'
        - name: categoryId
          in: query
          description: Matches products assigned to this category (primary or secondary).
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Paginated list of products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Product CRUD]
      summary: Get a product by ID
      operationId: getProductById
      responses:
        '200':
          description: Product found.
          headers:
            ETag:
              description: Current optimistic-lock version, e.g. `"7"`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Product CRUD]
      summary: Replace a product (full update, optimistic locking)
      operationId: updateProduct
      parameters:
        - name: If-Match
          in: header
          required: false
          description: >
            Optimistic concurrency control. Supply the version returned in the
            `ETag` header (e.g. `"7"`). If omitted, the replacement is applied
            unconditionally.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Product updated.
          headers:
            ETag:
              description: New optimistic-lock version.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/UniqueConflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      tags: [Product CRUD]
      summary: Delete a product
      operationId: deleteProduct
      responses:
        '204':
          description: >
            Product deleted. Variants are deleted with it (composition).
            For products already referenced by orders or downstream
            projections, prefer `status=DISCONTINUED` over deletion.
        '404':
          $ref: '#/components/responses/NotFound'

components:

  responses:
    BadRequest:
      description: Invalid request body or query parameters.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Product not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UniqueConflict:
      description: >
        Unique constraint violation — a variant SKU or SEO slug already
        exists somewhere in the catalog.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: If-Match header did not match the current product version.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: >
        Semantic business-rule violation — e.g. selectedOptions not matching
        the declared options, a duplicate variant combination within the
        product, no default variant, missing or duplicate primary category,
        or invalid bundle components.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:

    ProductStatus:
      type: string
      enum: [ACTIVE, INACTIVE, DISCONTINUED, COMING_SOON]

    VariantStatus:
      type: string
      description: >
        Variant lifecycle. RETIRED variants keep their SKU reserved but can
        no longer be added to carts — use RETIRED rather than omitting a
        variant once its SKU is referenced by orders, inventory events or
        the search projection.
      enum: [ACTIVE, INACTIVE, RETIRED]
      default: ACTIVE

    ProductKind:
      type: string
      description: >
        STANDARD products sell their own variants. BUNDLE products are kits
        assembled from other sellable variants; they carry exactly one
        variant (the bundle SKU) and their inventory/availability are
        computed from components in the read model.
      enum: [STANDARD, BUNDLE]

    Money:
      type: object
      description: >
        Monetary amount in integer minor units plus an ISO 4217 currency
        code. Example: amountMinor=9999, currency=USD → $99.99.
      required: [amountMinor, currency]
      additionalProperties: false
      properties:
        amountMinor:
          type: integer
          format: int64
          minimum: 0
          example: 9999
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: USD

    CategoryRef:
      type: object
      description: >
        Denormalized category snapshot resolved from the assigned categoryId.
        Category master data (the tree) is owned by this service.
      additionalProperties: false
      required: [categoryId, isPrimary]
      properties:
        categoryId:
          type: string
          format: uuid
          example: 0198f2a4-7c1d-7e6a-b1a2-c3d4e5f60718
        name:
          type: string
          maxLength: 128
          example: T-Shirts
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          example: t-shirts
        isPrimary:
          type: boolean
          description: >
            Exactly one assignment per product is primary; it drives listing
            pages and default navigation.

    CategoryAssignment:
      type: object
      description: >
        Request-side category assignment. Exactly one assignment per product
        must have isPrimary=true — zero or multiple primaries → 422.
      required: [categoryId]
      additionalProperties: false
      properties:
        categoryId:
          type: string
          format: uuid
        isPrimary:
          type: boolean
          default: false

    OptionDefinition:
      type: object
      description: >
        A variant axis declared on the product, e.g. "Color" with values
        [Black, Sand]. Option names must be unique within a product and must
        not duplicate an attribute name. Max 3 options keeps the variant
        matrix tractable.
      required: [name, values]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          example: Color
        values:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 100
          example: [Black, Sand]
        position:
          type: integer
          minimum: 0
          description: Display order of this option in pickers.

    SelectedOption:
      type: object
      description: A variant's resolved position in one axis of the option matrix.
      required: [optionName, value]
      additionalProperties: false
      properties:
        optionName:
          type: string
          example: Color
        value:
          type: string
          example: Black

    BundleComponent:
      type: object
      description: >
        One line of a bundle's recipe. `sku` must reference an existing,
        sellable variant SKU of another product — self-reference and unknown
        SKUs are rejected with 422.
      required: [sku, quantity]
      additionalProperties: false
      properties:
        sku:
          type: string
          maxLength: 64
          example: TEE-BLK-M
        quantity:
          type: integer
          minimum: 1
          example: 1

    Attribute:
      type: object
      description: >
        Descriptive product-level fact that is NOT a variant axis, e.g.
        "Material: organic cotton". Variant-distinguishing facts belong in
        options/selectedOptions instead.
      required: [name, value]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 64
        value:
          type: string
          maxLength: 512

    Image:
      type: object
      description: Product image. Exactly one image per product must have isPrimary=true.
      required: [url]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
        altText:
          type: string
          maxLength: 255
        isPrimary:
          type: boolean
          default: false
        position:
          type: integer
          minimum: 0

    Seo:
      type: object
      description: >
        Storefront presentation data. `slug` is unique across the catalog
        and is generated from the title when omitted (409 on conflict).
      additionalProperties: false
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          maxLength: 140
          example: trail-tee
        metaTitle:
          type: string
          maxLength: 160
        metaDescription:
          type: string
          maxLength: 320

    Variant:
      type: object
      description: >
        The sellable unit — one stocked cell of the product's option matrix.
        Owns SKU, price and lifecycle status. The product's `options` explain
        WHY variants differ; `selectedOptions` says which cell this is. SKU
        is globally unique; cart, orders and inventory events reference
        variantId/sku, never productId alone. Stock levels, weights and
        shipping dimensions are NOT stored here — the Inventory and Shipping
        services own them and key off this variant's identity.
      required: [sku, price]
      additionalProperties: false
      properties:
        variantId:
          type: string
          format: uuid
          description: >
            Server-generated UUIDv7. Ignored on create; used by PUT to
            reconcile variants.
        sku:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{2,63}$'
          maxLength: 64
          example: TEE-BLK-M
        selectedOptions:
          type: array
          maxItems: 3
          description: >
            Required when the product declares options: exactly one entry per
            declared option, values must come from the declared value list,
            and the combination must be unique within the product
            (violations → 422). Omit for products with no options.
          items:
            $ref: '#/components/schemas/SelectedOption'
        price:
          $ref: '#/components/schemas/Money'
        compareAtPrice:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/VariantStatus'
        isDefault:
          type: boolean
          default: false
          description: >
            Exactly one variant per product must be the default — its price
            is shown on listing pages and used for deep links. Server assigns
            the first variant if the client does not specify one (422 if the
            payload marks zero or multiple).
        barcode:
          type: string
          pattern: '^[0-9]{8,14}$'
          description: GTIN/UPC/EAN for retail and scanning.
        imageUrls:
          type: array
          maxItems: 5
          description: >
            Variant-specific shots (e.g. the sand colour). Clients fall back
            to the product's images when absent.
          items:
            type: string
            format: uri
            maxLength: 2048

    ProductFlags:
      type: object
      description: >
        Curated merchandising flags. Derived flags (isNew, isBestseller,
        lowStock) are computed in the read model and are not writable here.
      additionalProperties: false
      properties:
        isFeatured:
          type: boolean
          default: false

    Product:
      type: object
      description: >
        Full product resource as stored in the primary database. Business
        rules enforced server-side: option names unique per product; each
        variant's selectedOptions resolves against the declared options with
        a unique combination; exactly one default variant; exactly one
        primary category; BUNDLE products carry exactly one variant plus a
        non-empty bundleComponents recipe.
      additionalProperties: false
      required:
        - productId
        - version
        - title
        - status
        - productKind
        - categories
        - createdAt
        - updatedAt
      properties:
        productId:
          type: string
          format: uuid
          example: 0198f2a4-7c1d-7e6a-9b2e-5f4d3c2b1a09
        version:
          type: integer
          format: int64
          description: Optimistic-lock version. Changes on every update; exposed as ETag.
        title:
          type: string
          maxLength: 255
        brand:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 5000
        categories:
          type: array
          maxItems: 10
          description: Category assignments; exactly one with isPrimary=true.
          items:
            $ref: '#/components/schemas/CategoryRef'
        status:
          $ref: '#/components/schemas/ProductStatus'
        productKind:
          $ref: '#/components/schemas/ProductKind'
        options:
          type: array
          maxItems: 3
          description: The variant axes. Absent for simple products.
          items:
            $ref: '#/components/schemas/OptionDefinition'
        images:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Image'
        attributes:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Attribute'
        variants:
          type: array
          maxItems: 100
          description: >
            May be empty only for content-only drafts; a product cannot be
            purchased or activated without at least one variant.
          items:
            $ref: '#/components/schemas/Variant'
        bundleComponents:
          type: array
          maxItems: 50
          description: Present iff productKind=BUNDLE.
          items:
            $ref: '#/components/schemas/BundleComponent'
        seo:
          $ref: '#/components/schemas/Seo'
        flags:
          $ref: '#/components/schemas/ProductFlags'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateProductRequest:
      type: object
      description: >
        Create a product. productId, version and timestamps are
        server-generated. Variants may be supplied now or added later (draft);
        each variant must carry sku and price.
      required:
        - title
        - categories
        - status
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        brand:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 5000
        categories:
          type: array
          minItems: 1
          maxItems: 10
          description: Exactly one assignment must have isPrimary=true.
          items:
            $ref: '#/components/schemas/CategoryAssignment'
        status:
          $ref: '#/components/schemas/ProductStatus'
        productKind:
          $ref: '#/components/schemas/ProductKind'
        options:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/OptionDefinition'
        images:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Image'
        attributes:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Attribute'
        variants:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Variant'
        bundleComponents:
          type: array
          maxItems: 50
          description: Required iff productKind=BUNDLE.
          items:
            $ref: '#/components/schemas/BundleComponent'
        seo:
          $ref: '#/components/schemas/Seo'
        flags:
          $ref: '#/components/schemas/ProductFlags'

    UpdateProductRequest:
      type: object
      description: >
        Full replacement (PUT). Omitted optional collections are cleared.
        Variants are reconciled by variantId: matching variants updated,
        variants without variantId created, omitted variants deleted. All
        matrix, category and bundle rules are re-validated on the merged
        result.
      required:
        - title
        - categories
        - status
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        brand:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 5000
        categories:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/CategoryAssignment'
        status:
          $ref: '#/components/schemas/ProductStatus'
        productKind:
          $ref: '#/components/schemas/ProductKind'
        options:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/OptionDefinition'
        images:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Image'
        attributes:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Attribute'
        variants:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Variant'
        bundleComponents:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/BundleComponent'
        seo:
          $ref: '#/components/schemas/Seo'
        flags:
          $ref: '#/components/schemas/ProductFlags'

    ProductListResponse:
      type: object
      additionalProperties: false
      required: [results, pagination]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        pagination:
          $ref: '#/components/schemas/Pagination'

    Pagination:
      type: object
      additionalProperties: false
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    Problem:
      type: object
      description: RFC 9457 problem details, returned as application/problem+json.
      properties:
        type:
          type: string
          format: uri
          example: 'https://api.example.com/problems/invalid-variant-matrix'
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        errors:
          type: array
          description: Field-level validation details (extension).
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string